<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#0f3460" stroke-width="0.5"/>
    </pattern>
    <rect width="128" height="128" fill="url(#grid)"/>
  </g>
  
  <!-- Snake body -->
  <g filter="url(#glow)">
    <rect x="28" y="56" width="16" height="16" rx="3" fill="#00e676"/>
    <rect x="44" y="56" width="16" height="16" rx="3" fill="#00c853"/>
    <rect x="60" y="56" width="16" height="16" rx="3" fill="#00c853"/>
    <rect x="76" y="56" width="16" height="16" rx="3" fill="#00c853"/>
    
    <!-- Snake head -->
    <rect x="12" y="56" width="16" height="16" rx="3" fill="#00e676"/>
    <!-- Eyes -->
    <circle cx="20" cy="62" r="3" fill="#0d0d0d"/>
    <circle cx="20" cy="70" r="3" fill="#0d0d0d"/>
  </g>
  
  <!-- Apple -->
  <g filter="url(#glow)">
    <circle cx="100" cy="64" r="10" fill="#ff1744"/>
    <circle cx="96" cy="60" r="3" fill="#ff5252" opacity="0.6"/>
    <!-- Stem -->
    <path d="M 100 54 Q 102 50 104 54" stroke="#4e342e" stroke-width="2" fill="none"/>
    <!-- Leaf -->
    <ellipse cx="106" cy="52" rx="4" ry="2" fill="#4caf50" transform="rotate(-30 106 52)"/>
  </g>
  
  <!-- Level badge -->
  <rect x="88" y="88" width="28" height="18" rx="4" fill="#ffd600" opacity="0.9"/>
  <text x="102" y="101" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1a1a2e">L3</text>
  
  <!-- Title -->
  <text x="64" y="118" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e0e0e0">SNAKE</text>
</svg>