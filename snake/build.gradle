plugins {
    id 'java'
    id 'application'
}

group = 'snake'
version = '1.0'

mainClassName = 'SnakeMain'

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

ext {
    // LWJGL 3.3.6 - latest stable with arm64 natives
    // GLFW in natives may not have DRM support
    // We prefer system GLFW (libglfw3) via -Dorg.lwjgl.glfw.libname=glfw
    lwjglVersion = '3.3.6'
}

dependencies {
    // LWJGL core
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengles:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-egl:${lwjglVersion}"

    // Natives for ARM64 (Pi 4/5)
    // Note: lwjgl-egl natives not available for arm64 on maven central
    // We prefer system GLFW (libglfw3) via -Dorg.lwjgl.glfw.libname=glfw
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengles:${lwjglVersion}:natives-linux-arm64"
}

application {
    mainClass = 'SnakeMain'
    applicationDefaultJvmArgs = [
        // Prefer system GLFW (libglfw3) which may have DRM support
        // If not available, falls back to LWJGL natives
        '-Dorg.lwjgl.glfw.libname=glfw',
        '-Dorg.lwjgl.system.allocator=system',
        '-Xmx256m'
    ]
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'SnakeMain',
            'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
        )
    }
}

task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'SnakeMain'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

build.dependsOn fatJar